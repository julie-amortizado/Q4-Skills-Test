<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <style>
    body{
      margin:0;
      font-family: Poppins;
      background:linear-gradient(135deg,#e9ecef,#ffffff);
    }

    .container{
      width:100%;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .login-box{
      width:340px;
      background:white;
      padding:30px;
      border-radius:20px;
      box-shadow:0px 10px 25px rgba(0,0,0,0.2);
      text-align:center;
    }

    .logo{
      width:80px;
      margin-bottom:10px;
    }

    h1{
      margin-bottom:20px;
      color:#333;
    }

    input{
      width:280px;
      height:45px;
      margin:10px 0;
      padding-left:10px;
      border:1px solid #ccc;
      border-radius:10px;
      outline:none;
    }

    input:focus{
      border:1px solid #0d6efd;
    }

    .btn{
      width:120px;
      height:40px;
      margin-top:15px;
      border:none;
      border-radius:10px;
      cursor:pointer;
    }

    .login-btn{
      background:#0d6efd;
      color:white;
    }

    .login-btn:hover{
      background:#0b5ed7;
    }

    .cancel-btn{
      background:#e9ecef;
      color:#333;
      margin-left:10px;
    }

    .text{
      font-size:12px;
      color:gray;
      margin-top:10px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="login-box">

    <img class="logo" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

    <h1>Login</h1>

    <input type="text" id="username" placeholder="Username">
    <br>

    <input type="password" id="password" placeholder="Password">
    <br>

    <button class="btn login-btn" onclick="login()">Login</button>
    <button class="btn cancel-btn" onclick="clearFields()">Cancel</button>

    <p class="text">Enter your credentials to continue</p>

  </div>

</div>

<script>

  function login(){

    var user = document.getElementById("username").value;
    var pass = document.getElementById("password").value;

    if(user == "" || pass == ""){
      alert("Fill in all fields!");
    }
    else{
      window.location.href = "SkillsTest.html";
    }

  }

  function clearFields(){
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
  }

</script>

</body>
</html>
